# Cool-white + indigo light base for the neo-brutalist / minimalist blue theme.
# Values mirror the colour tokens in 05_Code/theme.py; its GLOBAL_CSS adds the thick
# ink borders and hard shadows on top of this base.
[theme]
base = "light"
primaryColor = "#1B3A8F"
backgroundColor = "#F3F5FA"
secondaryBackgroundColor = "#E9EDF7"
textColor = "#0A1633"
# Streamlit's bundled "Source Sans" (GLOBAL_CSS uses the same family).
font = "sans-serif"
# Near-square corners on every native element (inputs, menus, alerts, expanders,
# segmented controls, tooltips, containers) to match the 2px radius used in GLOBAL_CSS.
baseRadius = "2px"
# st.info in the indigo palette (BLUE text on BLUE_GHOST) instead of Streamlit's azure.
blueTextColor = "#1B3A8F"
blueBackgroundColor = "#EEF2FC"
linkColor = "#1B3A8F"

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 50
