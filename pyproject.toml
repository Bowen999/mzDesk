[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mzdesk"
description = "mzDesk: one-stop small-molecule mass spectrometry workbench"
readme = "admin/README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dynamic = ["version", "dependencies"]

[project.optional-dependencies]
test = ["pytest>=7", "httpx>=0.24"]   # httpx: FastAPI TestClient

[project.scripts]
mzdesk = "mzdesk.cli:main"

[tool.setuptools]
packages = { find = { include = ["mzdesk", "mzdesk.*"] } }

[tool.setuptools.package-data]
mzdesk = ["lib/*.js", "lib/*.jar", "lib/msfinder/*.ini", "lib/frigid/*", "ms2/frigid_driver/*.py", "gnps/redu_cache/*.gz", "static/**/*", "data/**/*"]

[tool.setuptools.dynamic]
version = { attr = "mzdesk.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
markers = ["network: real PubChem/UniChem calls (set MZDESK_NETWORK_TESTS=1)",
           "docker: real CFM-ID / MSRB runs in Docker (skipped when Docker or the image is missing)"]
