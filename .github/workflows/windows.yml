name: Windows

# unit: the Windows paths of the engines, on every change to them (fast, no downloads).
# engines: the real installs and one prediction per engine; started by hand (Actions -> Windows -> Run workflow), it downloads about 10 GB.
# full: `python dev_setup.py` (everything, one command), then the whole test suite; started by hand (Run workflow, full=true).
# CFM-ID needs Linux containers, which a Windows runner cannot run: it is covered by the unit job (the docker command line) only.
on:
  workflow_dispatch:
    inputs:
      engines:
        description: "Also install and run MS-FINDER, FRIGID, NEIMS, RepoRT, CCS and Pan-ReDU (long)"
        type: boolean
        default: false
      full:
        description: "Also run dev_setup.py (everything) and then every test (long)"
        type: boolean
        default: false
  pull_request:
    paths: ["mzdesk/ms2/**", "mzdesk/local/**", "mzdesk/shared/**", "mzdesk/methods/report*.py", "mzdesk/cli.py", "mzdesk/install/**", "tests/**", ".github/workflows/windows.yml"]
  push:
    branches: [main]
    paths: ["mzdesk/ms2/**", "mzdesk/local/**", "mzdesk/shared/**", "mzdesk/methods/report*.py", "mzdesk/cli.py", "mzdesk/install/**", "tests/**", ".github/workflows/windows.yml"]

jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest httpx
      - name: install.ps1 is valid PowerShell (Windows PowerShell 5.1, the one every Windows has)
        shell: powershell
        run: |
          $errors = $null; $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\mzdesk\install\install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host $_.Message }; exit 1 }
      - name: Tests that need no setup (the whole suite; NEEDS_SETUP in tests/conftest.py is skipped)
        env:
          MZDESK_TESTS_WITHOUT_SETUP: "1"
          PYTHONUTF8: "1"
        run: python -m pytest tests -q -rf -p no:cacheprovider -o faulthandler_timeout=300

  engines:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.engines }}
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: python -m pip install -r requirements.txt
      - name: Install through the same code the dialog uses
        run: python -m mzdesk setup --yes msfinder neims molgpka repo ccs redu
      - name: MS-FINDER
        run: python validation/windows/smoke.py msfinder
      - name: BUDDY (msbuddy and its LightGBM model)
        if: ${{ !cancelled() }}
        run: python validation/windows/smoke.py buddy
      - name: NEIMS
        if: ${{ !cancelled() }}   # run every engine even when an earlier one failed
        run: python validation/windows/smoke.py neims
      - name: RepoRT
        if: ${{ !cancelled() }}   # run every engine even when an earlier one failed
        run: python validation/windows/smoke.py repo
      - name: CCS
        if: ${{ !cancelled() }}
        run: python validation/windows/smoke.py ccs
      - name: Pan-ReDU
        if: ${{ !cancelled() }}
        run: python validation/windows/smoke.py redu
      - name: MS2DeepScore and Spec2Vec (torch, gensim)
        if: ${{ !cancelled() }}
        run: python validation/windows/smoke.py deep
      - name: FRIGID setup (conda comes with the runner)
        if: ${{ !cancelled() }}   # run every engine even when an earlier one failed
        run: |
          $env:CONDA_EXE = Join-Path $env:CONDA "Scripts\conda.exe"
          python -m mzdesk setup --yes frigid
      - name: FRIGID
        if: ${{ !cancelled() }}   # run every engine even when an earlier one failed
        run: python validation/windows/smoke.py frigid

  full:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: astral-sh/setup-uv@v5
      - name: One command for everything (conda comes with the runner, for FRIGID)
        run: |
          $env:CONDA_EXE = Join-Path $env:CONDA "Scripts\conda.exe"
          python dev_setup.py
      - name: Every test
        if: ${{ !cancelled() }}
        run: python -m pytest tests -v -p no:cacheprovider -o faulthandler_timeout=600 --durations=25   # -v: a test that hangs is named; after 10 min its stack is printed
      - name: Disk used
        if: ${{ !cancelled() }}
        run: Get-PSDrive C
