# mzdesk.com, port 80 only. Installed first, so the certificate can be requested (deploy/cutover.sh); nginx-mzdesk.conf replaces it.
server {
    listen 80;
    listen [::]:80;
    server_name mzdesk.com www.mzdesk.com;
    server_tokens off;
    # no IP addresses on disk: no access log, and an error log that keeps only emerg (start-up failures, never a client address)
    access_log off;
    error_log /var/log/nginx/mzdesk-error.log emerg;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://mzdesk.com$request_uri; }
}
