# mzDesk rate limits and upstream (http context). nginx loads this file before mzdesk.conf, which uses them.
limit_req_zone  $binary_remote_addr zone=mzdesk_page:10m  rate=20r/s;   # pages, assets, spec
limit_req_zone  $binary_remote_addr zone=mzdesk_run:10m   rate=30r/m;   # module runs (CPU heavy)
limit_req_zone  $binary_remote_addr zone=mzdesk_stats:1m  rate=6r/m;    # admin password checks (stats, reports)
limit_req_zone  $binary_remote_addr zone=mzdesk_feedback:1m rate=6r/m;  # feedback messages
limit_req_zone  $binary_remote_addr zone=mzdesk_crash:1m  rate=30r/m;   # crash reports from the browser
limit_conn_zone $binary_remote_addr zone=mzdesk_conn:10m;

upstream mzdesk_app { server 127.0.0.1:8599; keepalive 8; }
