    # mzDesk lives under /mzdesk/ (frontend built with base /mzdesk/); the prefix is stripped here
    # so FastAPI keeps its root-based routes. Rate limits: /etc/nginx/conf.d/00-mzdesk-limits.conf.
    location = /mzdesk { return 301 /mzdesk/; }

    location /mzdesk/ {
        limit_req zone=mzdesk_page burst=80 nodelay;
        limit_req_status 429;
        limit_conn mzdesk_conn 30;
        client_max_body_size 8m;            # pasted / uploaded spectra
        proxy_pass http://mzdesk_app/;      # trailing slash strips the /mzdesk prefix
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite: a client cannot fake its address
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # module runs: CPU heavy, slow (MetFrag up to minutes)
        location /mzdesk/api/modules/ {
            limit_req zone=mzdesk_run burst=20 nodelay;
            proxy_pass http://mzdesk_app/api/modules/;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
        # MassQL accepts one file up to 20 MB (base64 inside JSON).
        location = /mzdesk/api/modules/gnps_massql/run {
            limit_req zone=mzdesk_run burst=20 nodelay;
            client_max_body_size 28m;
            proxy_pass http://mzdesk_app/api/modules/gnps_massql/run;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
        # fastMASST may wait for two remote searches and verify selected hits.
        location = /mzdesk/api/modules/gnps_fastmasst/run {
            limit_req zone=mzdesk_run burst=20 nodelay;
            proxy_pass http://mzdesk_app/api/modules/gnps_fastmasst/run;
            proxy_read_timeout 1800s;
            proxy_send_timeout 300s;
        }
        # stats: password guesses are throttled hard
        location = /mzdesk/api/stats {
            limit_req zone=mzdesk_stats burst=5 nodelay;
            proxy_pass http://mzdesk_app/api/stats;
        }
        # feedback: every accepted request sends an email; nginx throttles before the app sees it
        location = /mzdesk/api/feedback {
            limit_req zone=mzdesk_feedback burst=3 nodelay;
            proxy_pass http://mzdesk_app/api/feedback;
            proxy_read_timeout 30s;
        }
        # FastAPI's built-in API browser stays private
        location ~ ^/mzdesk/(docs|redoc|openapi\.json) { return 404; }
    }
