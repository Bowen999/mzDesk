# https://mzdesk.com/ : the app at the root. Installed as /etc/nginx/conf.d/mzdesk.conf by deploy/cutover.sh (needs the certificate).
# Rate limits and the upstream: 00-mzdesk-limits.conf. The app sets the content security headers itself (mzdesk/api/security.py);
# nginx adds only what belongs to the connection: HSTS.
# No server block writes a client IP address to disk (access_log off; error_log at emerg): see mzdesk/docs/privacy.md.

# port 80: certificate renewals (webroot) and the redirect to https
server {
    listen 80;
    listen [::]:80;
    server_name mzdesk.com www.mzdesk.com;
    server_tokens off;
    # no IP addresses on disk: no access log, and an error log that keeps only emerg (start-up failures, never a client address)
    access_log off;
    error_log /var/log/nginx/mzdesk-error.log emerg;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://mzdesk.com$request_uri; }
}

# www -> the bare name
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.mzdesk.com;
    server_tokens off;
    # no IP addresses on disk: no access log, and an error log that keeps only emerg (start-up failures, never a client address)
    access_log off;
    error_log /var/log/nginx/mzdesk-error.log emerg;
    ssl_certificate     /etc/letsencrypt/live/mzdesk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mzdesk.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://mzdesk.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mzdesk.com;
    server_tokens off;
    # no IP addresses on disk: no access log, and an error log that keeps only emerg (start-up failures, never a client address)
    access_log off;
    error_log /var/log/nginx/mzdesk-error.log emerg;

    ssl_certificate     /etc/letsencrypt/live/mzdesk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mzdesk.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_header_timeout 10s;
    client_body_timeout   30s;
    keepalive_timeout     30s;
    client_max_body_size  8m;            # pasted spectra and up to three screenshots
    limit_conn mzdesk_conn 30;
    limit_req_status 429;

    # the app sees the real client address; a client cannot fake it (X-Forwarded-For is overwritten, uvicorn trusts 127.0.0.1 only)
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # pages, assets, the page list, workflow polling
    location / {
        limit_req zone=mzdesk_page burst=80 nodelay;
        proxy_pass http://mzdesk_app;
    }

    # module runs: CPU heavy, slow (MetFrag up to minutes)
    location /api/modules/ {
        limit_req zone=mzdesk_run burst=20 nodelay;
        proxy_pass http://mzdesk_app;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    # MassQL accepts one file up to 20 MB (base64 inside JSON).
    location = /api/modules/gnps_massql/run {
        limit_req zone=mzdesk_run burst=20 nodelay;
        client_max_body_size 28m;
        proxy_pass http://mzdesk_app;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    # De Novo Structure (FRIGID on the CPU): a Quick run takes about two minutes, a Full run up to the engine's 20 minutes.
    location = /api/modules/ms2_denovo/run {
        limit_req zone=mzdesk_run burst=20 nodelay;
        proxy_pass http://mzdesk_app;
        proxy_read_timeout 1300s;
        proxy_send_timeout 300s;
    }
    # fastMASST may wait for two remote searches and verify selected hits.
    location = /api/modules/gnps_fastmasst/run {
        limit_req zone=mzdesk_run burst=20 nodelay;
        proxy_pass http://mzdesk_app;
        proxy_read_timeout 1800s;
        proxy_send_timeout 300s;
    }
    # admin password checks (stats, reports): guesses are throttled hard
    location = /api/stats {
        limit_req zone=mzdesk_stats burst=5 nodelay;
        proxy_pass http://mzdesk_app;
    }
    location /api/reports {
        limit_req zone=mzdesk_stats burst=10 nodelay;
        proxy_pass http://mzdesk_app;
    }
    # feedback: every message is stored (and forwarded); nginx throttles before the app sees it
    location = /api/feedback {
        limit_req zone=mzdesk_feedback burst=3 nodelay;
        proxy_pass http://mzdesk_app;
        proxy_read_timeout 30s;
    }
    # crash reports from the browser (a crash loop repeats; the app counts repeats instead of storing them)
    location = /api/crash {
        limit_req zone=mzdesk_crash burst=10 nodelay;
        proxy_pass http://mzdesk_app;
        proxy_read_timeout 30s;
    }
    # The local version's installer: /install.sh, /install.ps1 and /version.json are small and fall under `location /` above (the page limit).
    # The wheel (about 80 MB) is streamed by the app, not buffered by nginx; a slow connection gets 15 minutes between two writes.
    # The app sends it with Content-Encoding: identity, which also keeps nginx's own gzip (if it is on globally) away from it.
    location /download/ {
        limit_req zone=mzdesk_download burst=6 nodelay;
        proxy_pass http://mzdesk_app;
        proxy_buffering off;
        gzip off;
        proxy_read_timeout 900s;
        send_timeout 900s;
    }
    # no dotfiles, ever (the app has none; this keeps scanners out of its logs)
    location ~ /\.(?!well-known) { return 404; }
}
