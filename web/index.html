<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>mzDesk</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      /* the saved theme, before the first paint (src/themeMode.ts keeps it from there) */
      try { var t = localStorage.getItem("mzdesk.theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
      /* the opening splash plays once per browser session (tab): the first load sets the mark, later loads of the session skip it */
      try { if (sessionStorage.getItem("mzdesk.splash")) document.documentElement.className += " no-splash"; else sessionStorage.setItem("mzdesk.splash", "1"); } catch (e) {}
    </script>
    <style>
      /* Opening splash: the desk rolls in, the name follows. Plain CSS in the page itself, so it plays while the app downloads. */
      html { background: #fff; }
      html[data-theme="dark"] { background: #121418; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) { background: #121418; } }
      #splash {
        --ink: #161a23; --paper: #fff; --top: #2f4b86; --back: #5b6070; --wall: #d7dae1; --ceil: #9aa0ad; --bg: #fff;
        position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; overflow: hidden; background: var(--bg); cursor: pointer;
        transition: opacity .45s ease, transform .45s ease, visibility 0s .45s;
      }
      html[data-theme="dark"] #splash { --ink: #e8eaf0; --paper: #121418; --top: #7b9cf0; --back: #3a3f4b; --wall: #9198a6; --ceil: #6c7381; --bg: #121418; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) #splash { --ink: #e8eaf0; --paper: #121418; --top: #7b9cf0; --back: #3a3f4b; --wall: #9198a6; --ceil: #6c7381; --bg: #121418; } }
      html.no-splash #splash { display: none; }
      #splash.sp-out { opacity: 0; transform: scale(1.025); visibility: hidden; pointer-events: none; }
      .sp-stage { display: flex; align-items: flex-end; justify-content: center; }
      .sp-logo { width: 78px; height: auto; flex: none; overflow: visible; transform-origin: 50% 82%; animation: sp-roll 1.15s cubic-bezier(.22, .7, .3, 1) both; }
      .sp-logo .f, .sp-logo .l { fill: var(--ink); }
      .sp-logo .s { fill: var(--paper); }
      .sp-logo .t { fill: var(--top); }
      .sp-logo .b { fill: var(--back); }
      .sp-logo .w { fill: var(--wall); }
      .sp-logo .c { fill: var(--ceil); }
      .sp-logo .f, .sp-logo .s, .sp-logo .t { stroke: var(--ink); stroke-width: 2.4; stroke-linejoin: round; }
      .sp-name { display: block; max-width: 0; margin-left: 0; overflow: hidden; opacity: 0; white-space: nowrap; animation: sp-name .7s cubic-bezier(.2, .8, .2, 1) .95s forwards; }
      .sp-name b { display: block; padding: 0 2px 2px 0; color: var(--ink); font: 600 60px/1 "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -.025em; animation: sp-letters .7s cubic-bezier(.2, .8, .2, 1) .95s both; }
      /* the desk tumbles in from the left: two turns, a small overshoot, a squash as it lands */
      @keyframes sp-roll {
        0% { transform: translateX(-46vw) rotate(-720deg); opacity: 0; }
        8% { opacity: 1; }
        72% { transform: translateX(10px) rotate(9deg) scale(1, 1); }
        84% { transform: translateX(-3px) rotate(-3deg) scale(1.05, .93); }
        100% { transform: translateX(0) rotate(0) scale(1, 1); opacity: 1; }
      }
      @keyframes sp-name { from { max-width: 0; margin-left: 0; opacity: 0; } to { max-width: 300px; margin-left: 12px; opacity: 1; } }
      @keyframes sp-letters { from { transform: translateX(-26px); } to { transform: none; } }
      @media (max-width: 480px) { .sp-logo { width: 58px; } .sp-name b { font-size: 44px; } }
      @media (prefers-reduced-motion: reduce) {
        .sp-logo { animation: sp-fade .4s ease both; }
        .sp-name { animation: sp-name .01s .2s forwards; }
        .sp-name b { animation: none; }
        @keyframes sp-fade { from { opacity: 0; } }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <div class="sp-stage">
        <svg class="sp-logo" viewBox="0 0 74.08 86.80" focusable="false">
          <polygon class="b" points="23.88,36.80 30.81,40.80 30.81,64.00 23.88,60.00" />
          <polygon class="w" points="9.33,45.20 23.88,36.80 23.88,60.00 9.33,68.40" />
          <polygon class="c" points="9.33,45.20 16.26,49.20 30.81,40.80 23.88,36.80" />
          <polygon class="b" points="37.73,44.80 44.66,48.80 44.66,72.00 37.73,68.00" />
          <polygon class="w" points="23.18,53.20 37.73,44.80 37.73,68.00 23.18,76.40" />
          <polygon class="c" points="23.18,53.20 30.11,57.20 44.66,48.80 37.73,44.80" />
          <polygon class="f" points="2.40,22.40 37.04,42.40 37.04,84.40 30.11,80.40 30.11,57.20 23.18,53.20 23.18,76.40 16.26,72.40 16.26,49.20 9.33,45.20 9.33,68.40 2.40,64.40" />
          <polygon class="s" points="37.04,42.40 71.68,22.40 71.68,64.40 37.04,84.40" />
          <polygon class="t" points="37.04,2.40 71.68,22.40 37.04,42.40 2.40,22.40" />
          <polygon class="l" points="45.35,46.80 63.37,36.40 63.37,41.20 51.24,61.80 63.37,54.80 63.37,59.60 45.35,70.00 45.35,65.20 57.48,44.60 45.35,51.60" />
        </svg>
        <span class="sp-name"><b>mzDesk</b></span>
      </div>
    </div>
    <script>
      /* The splash stays until the app has its page list and the animation has had its time; a click skips the wait, a failsafe never traps the page. */
      (function () {
        var el = document.getElementById("splash"), ready = false, skip = false, closed = false, MIN = 2000;
        if (document.documentElement.className.indexOf("no-splash") >= 0) { el.remove(); window.mzdeskReady = function () {}; return; }
        function out() { if (closed || !el) return; closed = true; el.classList.add("sp-out"); setTimeout(function () { el.remove(); }, 700); }
        function check() { if (ready) setTimeout(out, skip ? 0 : Math.max(0, MIN - performance.now())); }
        window.mzdeskReady = function () { ready = true; check(); };
        el.addEventListener("click", function () { skip = true; check(); });
        document.addEventListener("keydown", function () { skip = true; check(); });
        setTimeout(out, 15000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
