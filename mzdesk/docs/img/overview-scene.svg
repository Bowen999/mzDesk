<rect class="fg-fill-accent" x="570" y="166" width="150" height="6" rx="3"/>
<rect class="fg-fill-accent" x="570" y="177" width="108" height="6" rx="3" opacity="0.6"/>
<rect class="fg-fill-accent" x="570" y="188" width="70" height="6" rx="3" opacity="0.3"/>

<rect class="fg-box" x="554" y="212" width="190" height="70" rx="12"/>
<rect class="fg-stroke-accent" x="568" y="227" width="26" height="40" rx="4"/>
<rect class="fg-fill-accent" x="575" y="222" width="12" height="8" rx="2"/>
<path class="fg-stroke-accent" d="M574 241H588M574 249H588M574 257H584"/>
<text class="fg-title" x="606" y="244">Method sheet</text>
<text class="fg-muted" x="606" y="264">column, ion, m/z</text>

<rect class="fg-box" x="554" y="292" width="190" height="70" rx="12"/>
<path class="fg-stroke-accent" d="M568 306H586L594 314V348H568Z"/>
