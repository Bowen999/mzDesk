<svg viewBox="0 0 720 544" xmlns="http://www.w3.org/2000/svg">
<title>28 modules and 3 workflows</title>
<desc>The 28 modules of mzDesk as one bar and six cards, each group in its own colour: Compound (4), Detectability (7), MS1 (2), Spectrum (10), Orthogonal (1), Dataset Search (3) and the Calculator. Below, in solid blue, the 3 workflows: MS/MS Annotation (8 steps), EI MS Annotation (9 steps) and Targeted Method (9 steps).</desc>
