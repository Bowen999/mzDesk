<svg viewBox="0 0 720 488" xmlns="http://www.w3.org/2000/svg">
<title>The nine steps of Targeted Method</title>
<desc>The nine steps of the Targeted Method workflow in order, with the engine or data each one uses. The separation and adduct steps are skipped on the GC-MS route.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path class="fg-head" d="M1 1.5L9 5L1 8.5z"/></marker><marker id="ahx" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path class="fg-head-accent" d="M1 1.5L9 5L1 8.5z"/></marker></defs>
<text class="fg-muted" x="60" y="22">Stage</text>
<text class="fg-muted" x="272" y="22">Engine or data</text>
<text class="fg-muted" x="424" y="22">What it does</text>
<path class="fg-line" d="M34 56L34 424" stroke-width="2"/>
<circle class="fg-dot" cx="34" cy="56" r="13"/>
<text class="fg-dot-text" x="34" y="61" text-anchor="middle">1</text>
<text class="fg-title" x="60" y="61">Identity</text>
<rect class="fg-box-soft" x="272" y="41" width="136" height="30" rx="8"/>
<text class="fg-text" x="340" y="61" text-anchor="middle">PubChem</text>
<text class="fg-muted" x="424" y="61">name, formula and mass</text>
<circle class="fg-dot" cx="34" cy="102" r="13"/>
<text class="fg-dot-text" x="34" y="107" text-anchor="middle">2</text>
<text class="fg-title" x="60" y="107">Platform</text>
<rect class="fg-box-soft" x="272" y="87" width="136" height="30" rx="8"/>
<text class="fg-text" x="340" y="107" text-anchor="middle">mzDesk</text>
<text class="fg-muted" x="424" y="107">LC-MS or GC-MS</text>
<circle class="fg-box-accent" cx="34" cy="148" r="13" stroke-dasharray="4 3"/>
<text class="fg-accent-text" x="34" y="153" text-anchor="middle">3</text>
<text class="fg-title" x="60" y="153">Separation</text>
<rect class="fg-box-soft" x="272" y="133" width="136" height="30" rx="8" stroke-dasharray="5 4"/>
<text class="fg-text" x="340" y="153" text-anchor="middle">MolGpKa</text>
<text class="fg-muted" x="424" y="153">column and pH, LC only</text>
<circle class="fg-dot" cx="34" cy="194" r="13"/>
<text class="fg-dot-text" x="34" y="199" text-anchor="middle">4</text>
<text class="fg-title" x="60" y="199">Ionization</text>
<rect class="fg-box-soft" x="272" y="179" width="136" height="30" rx="8"/>
<text class="fg-text" x="340" y="199" text-anchor="middle">MolGpKa</text>
<text class="fg-muted" x="424" y="199">which ion mode responds</text>
<circle class="fg-box-accent" cx="34" cy="240" r="13" stroke-dasharray="4 3"/>
<text class="fg-accent-text" x="34" y="245" text-anchor="middle">5</text>
<text class="fg-title" x="60" y="245">Adducts</text>
<rect class="fg-box-soft" x="272" y="225" width="136" height="30" rx="8" stroke-dasharray="5 4"/>
<text class="fg-text" x="340" y="245" text-anchor="middle">MolGpKa</text>
<text class="fg-muted" x="424" y="245">the main ion, LC-MS only</text>
<circle class="fg-dot" cx="34" cy="286" r="13"/>
<text class="fg-dot-text" x="34" y="291" text-anchor="middle">6</text>
<text class="fg-title" x="60" y="291">Non-MS detection</text>
<rect class="fg-box-soft" x="272" y="271" width="136" height="30" rx="8"/>
<text class="fg-text" x="340" y="291" text-anchor="middle">mzDesk</text>
<text class="fg-muted" x="424" y="291">other detectors, if needed</text>
<circle class="fg-dot" cx="34" cy="332" r="13"/>
<text class="fg-dot-text" x="34" y="337" text-anchor="middle">7</text>
<text class="fg-title" x="60" y="337">Derivatization</text>
<rect class="fg-box-soft" x="272" y="317" width="136" height="30" rx="8"/>
<text class="fg-text" x="340" y="337" text-anchor="middle">mzDesk</text>
<text class="fg-muted" x="424" y="337">whether to derivatize</text>
<circle class="fg-dot" cx="34" cy="378" r="13"/>
<text class="fg-dot-text" x="34" y="383" text-anchor="middle">8</text>
<text class="fg-title" x="60" y="383">Known methods</text>
<rect class="fg-box-soft" x="272" y="363" width="136" height="30" rx="8"/>
<text class="fg-text" x="340" y="383" text-anchor="middle">JP18, RepoRT</text>
<text class="fg-muted" x="424" y="383">published methods</text>
<circle class="fg-dot" cx="34" cy="424" r="13"/>
<text class="fg-dot-text" x="34" y="429" text-anchor="middle">9</text>
<text class="fg-title" x="60" y="429">Theoretical m/z</text>
<rect class="fg-box-soft" x="272" y="409" width="136" height="30" rx="8"/>
<text class="fg-text" x="340" y="429" text-anchor="middle">IsoSpecPy</text>
<text class="fg-muted" x="424" y="429">m/z of the main ion</text>
<text class="fg-muted" x="20" y="476">Dashed: runs only when needed.</text>
</svg>
