<svg viewBox="0 0 720 488" xmlns="http://www.w3.org/2000/svg">
<title>The nine steps of EI MS Annotation</title>
<desc>The nine steps of the EI MS Annotation workflow in order, with the engine or data each one uses. The retention index step runs only with an alkane series.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path class="fg-head" d="M1 1.5L9 5L1 8.5z"/></marker><marker id="ahx" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path class="fg-head-accent" d="M1 1.5L9 5L1 8.5z"/></marker></defs>
<text class="fg-muted" x="60" y="22">Stage</text>
<text class="fg-muted" x="272" y="22">Engine or data</text>
<text class="fg-muted" x="424" y="22">What it does</text>
<path class="fg-line" d="M34 56L34 424" stroke-width="2"/>
<circle class="fg-dot" cx="34" cy="56" r="13"/>
<text class="fg-dot-text" x="34" y="61" text-anchor="middle">1</text>
<text class="fg-title" x="60" y="61">Spectrum cleanup</text>
<rect class="fg-box-soft" x="272" y="41" width="136" height="30" rx="8"/>
<text class="fg-text" x="340" y="61" text-anchor="middle">mzDesk</text>
<text class="fg-muted" x="424" y="61">removes noise peaks</text>
<circle class="fg-dot" cx="34" cy="102" r="13"/>
<text class="fg-dot-text" x="34" y="107" text-anchor="middle">2</text>
<text class="fg-title" x="60" y="107">EI library search</text>
<rect class="fg-box-soft" x="272" y="87" width="136" height="30" rx="8"/>
<text class="fg-text" x="340" y="107" text-anchor="middle">MassBank, GNPS</text>
<text class="fg-muted" x="424" y="107">finds matching library spectra</text>
<circle class="fg-dot" cx="34" cy="148" r="13"/>
<text class="fg-dot-text" x="34" y="153" text-anchor="middle">3</text>
<text class="fg-title" x="60" y="153">Derivatization markers</text>
<rect class="fg-box-soft" x="272" y="133" width="136" height="30" rx="8"/>
<text class="fg-text" x="340" y="153" text-anchor="middle">mzDesk</text>
<text class="fg-muted" x="424" y="153">marker ions show TMS groups</text>
<circle class="fg-dot" cx="34" cy="194" r="13"/>
<text class="fg-dot-text" x="34" y="199" text-anchor="middle">4</text>
<text class="fg-title" x="60" y="199">Candidates</text>
<rect class="fg-box-soft" x="272" y="179" width="136" height="30" rx="8"/>
<text class="fg-text" x="340" y="199" text-anchor="middle">hits + your list</text>
<text class="fg-muted" x="424" y="199">merged by structure</text>
<circle class="fg-dot" cx="34" cy="240" r="13"/>
<text class="fg-dot-text" x="34" y="245" text-anchor="middle">5</text>
<text class="fg-title" x="60" y="245">Derivatives</text>
<rect class="fg-box-soft" x="272" y="225" width="136" height="30" rx="8"/>
<text class="fg-text" x="340" y="245" text-anchor="middle">RDKit</text>
<text class="fg-muted" x="424" y="245">derivative of each candidate</text>
<circle class="fg-dot" cx="34" cy="286" r="13"/>
<text class="fg-dot-text" x="34" y="291" text-anchor="middle">6</text>
<text class="fg-title" x="60" y="291">NEIMS prediction</text>
<rect class="fg-box-soft" x="272" y="271" width="136" height="30" rx="8"/>
<text class="fg-text" x="340" y="291" text-anchor="middle">NEIMS</text>
<text class="fg-muted" x="424" y="291">predicted spectrum per derivative</text>
<circle class="fg-dot" cx="34" cy="332" r="13"/>
<text class="fg-dot-text" x="34" y="337" text-anchor="middle">7</text>
<text class="fg-title" x="60" y="337">Similarity and rerank</text>
<rect class="fg-box-soft" x="272" y="317" width="136" height="30" rx="8"/>
<text class="fg-text" x="340" y="337" text-anchor="middle">mzDesk</text>
<text class="fg-muted" x="424" y="337">library matches rank first</text>
<circle class="fg-box-accent" cx="34" cy="378" r="13" stroke-dasharray="4 3"/>
<text class="fg-accent-text" x="34" y="383" text-anchor="middle">8</text>
<text class="fg-title" x="60" y="383">Kovats RI</text>
<rect class="fg-box-soft" x="272" y="363" width="136" height="30" rx="8" stroke-dasharray="5 4"/>
<text class="fg-text" x="340" y="383" text-anchor="middle">mzDesk</text>
<text class="fg-muted" x="424" y="383">needs your alkane series</text>
<circle class="fg-dot" cx="34" cy="424" r="13"/>
<text class="fg-dot-text" x="34" y="429" text-anchor="middle">9</text>
<text class="fg-title" x="60" y="429">Answer</text>
<rect class="fg-box-soft" x="272" y="409" width="136" height="30" rx="8"/>
<text class="fg-text" x="340" y="429" text-anchor="middle">mzDesk</text>
<text class="fg-muted" x="424" y="429">top candidate with its level</text>
<text class="fg-muted" x="20" y="476">Dashed: runs only when needed.</text>
</svg>
