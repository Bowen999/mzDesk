<svg viewBox="0 0 720 262" xmlns="http://www.w3.org/2000/svg">
<title>From one input to one answer</title>
<desc>A workflow takes one input and runs a fixed chain of modules on it, in order, and ends with one answer. A module can also be used on its own: one input in, one result out.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path class="fg-head" d="M1 1.5L9 5L1 8.5z"/></marker><marker id="ahx" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path class="fg-head-accent" d="M1 1.5L9 5L1 8.5z"/></marker></defs>
<text class="fg-title" x="20" y="28">Workflow</text>
<text class="fg-muted" x="104" y="28">a fixed chain of modules on one input</text>
<rect class="fg-box" x="20" y="44" width="140" height="88" rx="10"/>
<text class="fg-title" x="90" y="80" text-anchor="middle">One input</text>
<text class="fg-muted" x="90" y="101" text-anchor="middle">a spectrum or</text>
<text class="fg-muted" x="90" y="119" text-anchor="middle">a compound</text>
<path class="fg-arrow" d="M160 88L196 88" marker-end="url(#ah)"/>
<rect class="fg-box-accent" x="196" y="44" width="328" height="88" rx="10"/>
<rect class="fg-box" x="214" y="58" width="44" height="40" rx="8"/>
<text class="fg-title" x="236" y="84" text-anchor="middle">1</text>
<path class="fg-arrow" d="M258 78L276 78" marker-end="url(#ah)"/>
<rect class="fg-box" x="276" y="58" width="44" height="40" rx="8"/>
<text class="fg-title" x="298" y="84" text-anchor="middle">2</text>
<path class="fg-arrow" d="M320 78L338 78" marker-end="url(#ah)"/>
<rect class="fg-box" x="338" y="58" width="44" height="40" rx="8"/>
<text class="fg-title" x="360" y="84" text-anchor="middle">3</text>
<path class="fg-arrow" d="M382 78L400 78" marker-end="url(#ah)"/>
<rect class="fg-box" x="400" y="58" width="44" height="40" rx="8"/>
<text class="fg-title" x="422" y="84" text-anchor="middle">4</text>
<path class="fg-arrow" d="M444 78L462 78" marker-end="url(#ah)"/>
<rect class="fg-box" x="462" y="58" width="44" height="40" rx="8"/>
<text class="fg-title" x="484" y="84" text-anchor="middle">5</text>
<text class="fg-small" x="360" y="120" text-anchor="middle">modules, one after another</text>
<path class="fg-arrow" d="M524 88L560 88" marker-end="url(#ah)"/>
<rect class="fg-box" x="560" y="44" width="140" height="88" rx="10"/>
<text class="fg-title" x="630" y="80" text-anchor="middle">One answer</text>
<text class="fg-muted" x="630" y="101" text-anchor="middle">with its level</text>
<text class="fg-muted" x="630" y="119" text-anchor="middle">and evidence</text>
<path class="fg-line" d="M20 152L700 152"/>
<text class="fg-title" x="20" y="182">Module</text>
<text class="fg-muted" x="86" y="182">one question on its own</text>
<rect class="fg-box" x="20" y="198" width="140" height="52" rx="10"/>
<text class="fg-title" x="90" y="229" text-anchor="middle">Your input</text>
<path class="fg-arrow" d="M160 224L196 224" marker-end="url(#ah)"/>
<rect class="fg-box-soft" x="196" y="198" width="328" height="52" rx="10"/>
<text class="fg-title" x="360" y="220" text-anchor="middle">One module</text>
<text class="fg-muted" x="360" y="238" text-anchor="middle">for example Library Search or Identity</text>
<path class="fg-arrow" d="M524 224L560 224" marker-end="url(#ah)"/>
<rect class="fg-box" x="560" y="198" width="140" height="52" rx="10"/>
<text class="fg-title" x="630" y="229" text-anchor="middle">Its result</text>
</svg>
