<svg viewBox="0 0 720 540" xmlns="http://www.w3.org/2000/svg">
<title>The mzDesk window</title>
<desc>A schematic of the mzDesk window. Down the left, the sidebar: the logo, the module groups, the workflows, the Internet search switch, the Session report button, Docs, and the theme, language and feedback buttons. On the right, the page: its head, the input form, the Run and example buttons, then the progress bar, the answer and the steps. Twelve numbered marks, in the margins, point at these parts.</desc>
<!--
Numbers in this figure (the list on the Quick Start page uses the same):
 1 logo, version, collapse button        7 theme, language, feedback          
 2 module groups (and the Calculator)    8 page head                          
 3 workflows                             9 input form                         
 4 Internet search switch (local)       10 Run, Clear and the example buttons 
 5 Session report                       11 progress bar, answer, candidates   
 6 Docs                                 12 steps timeline (workflows)        
-->
