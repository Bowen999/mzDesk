<svg viewBox="0 0 720 580" xmlns="http://www.w3.org/2000/svg">
<title>The mzDesk window</title>
<desc>A schematic of the mzDesk window. On the left, the sidebar with the logo, the module groups, the workflows, the Internet search switch, the Session report button, Docs, and the theme, language and feedback buttons. On the right, the page: its head, the input form, the example buttons and the Run bar, then the progress bar, the answer and the steps. Thirteen numbered marks point at these parts.</desc>
<!--
Numbers in this figure:
 1 logo, version and the collapse button     8 page head: title and "what goes in, what comes out"
 2 module groups (and the Calculator)        9 input form
 3 workflows                                10 Run bar: Run and Clear
 4 Internet search switch (local version)   11 example buttons
 5 Session report button                    12 progress bar, then the answer
 6 Docs                                     13 steps timeline
 7 theme, language and feedback
-->
<defs><marker id="ah" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path class="fg-head" d="M1 1.5L9 5L1 8.5z"/></marker><marker id="ahx" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path class="fg-head-accent" d="M1 1.5L9 5L1 8.5z"/></marker></defs>
